# ============================================================
#  NETLIFY CONFIGURATION — portfolio
#  Tells Netlify where to find serverless functions and sets
#  default build/publish settings.
# ============================================================

[build]
  # The folder Netlify publishes (root of your static site)
  publish = "."

  # Where Netlify looks for serverless function files
  functions = "netlify/functions"

# Redirect all requests to /.netlify/functions/* to the functions runtime
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
